{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-teal-50 to-purple-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-lg border border-teal-100">
    <div>
      <h2 class="mt-2 text-center text-3xl font-extrabold text-teal-800">
        Join Manas Mitra 🧘
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Start your wellness journey today
      </p>
    </div>
    
    {% if error %}
    <div class="bg-red-50 border-l-4 border-red-400 p-4 mb-4">
      <div class="flex">
        <div class="ml-3">
          <p class="text-sm text-red-700">{{ error }}</p>
        </div>
      </div>
    </div>
    {% endif %}

    <form class="mt-8 space-y-6" action="/auth/register" method="POST" x-data="{ password: '', confirm: '', match: true }" @submit="match = (password === confirm); if(!match) $event.preventDefault();">
      <div class="rounded-md shadow-sm space-y-4">
        <div>
          <label for="name" class="sr-only">Full Name</label>
          <input id="name" name="name" type="text" required class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-teal-500 focus:border-teal-500 sm:text-sm" placeholder="Full Name">
        </div>
        <div>
          <label for="email-address" class="sr-only">Email address</label>
          <input id="email-address" name="email" type="email" autocomplete="email" required class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-teal-500 focus:border-teal-500 sm:text-sm" placeholder="Email address">
        </div>
        <div>
          <label for="phone" class="sr-only">Phone (optional)</label>
          <input id="phone" name="phone" type="text" class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-teal-500 focus:border-teal-500 sm:text-sm" placeholder="Phone (optional)">
        </div>
        <div>
          <label for="password" class="sr-only">Password</label>
          <input id="password" name="password" type="password" x-model="password" required class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-teal-500 focus:border-teal-500 sm:text-sm" placeholder="Password">
        </div>
        <div>
          <label for="confirm-password" class="sr-only">Confirm Password</label>
          <input id="confirm-password" type="password" x-model="confirm" required class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-teal-500 focus:border-teal-500 sm:text-sm" placeholder="Confirm Password">
          <p x-show="!match" class="text-red-500 text-xs mt-1">Passwords do not match.</p>
        </div>
      </div>

      <div class="flex items-center">
        <input id="terms" name="terms" type="checkbox" required class="h-4 w-4 text-teal-600 focus:ring-teal-500 border-gray-300 rounded">
        <label for="terms" class="ml-2 block text-sm text-gray-900">
          I agree to the Terms & Conditions
        </label>
      </div>

      <div>
        <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-gradient-to-r from-teal-500 to-teal-600 hover:from-teal-600 hover:to-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 shadow-md transform transition hover:-translate-y-0.5">
          Register
        </button>
      </div>
      
      <div class="text-center mt-4">
        <a href="/auth/login" class="font-medium text-teal-600 hover:text-teal-500 text-sm">
          Already have an account? Login here
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
