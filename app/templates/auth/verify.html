{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-teal-50 to-purple-50 py-12 px-4 sm:px-6 lg:px-8" x-data x-init="setTimeout(() => window.location.href='/auth/login', 3000)">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-lg border border-teal-100 text-center">
    <div class="flex justify-center">
      <div class="rounded-full bg-green-100 p-4 mb-4">
        <svg class="w-12 h-12 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
      </div>
    </div>
    <h2 class="text-2xl font-bold text-gray-900">Email Verified Successfully!</h2>
    <p class="text-gray-500 mt-2">You will be redirected to the login page shortly.</p>
    <div class="mt-6">
      <a href="/auth/login" class="text-teal-600 hover:text-teal-700 font-medium">Click here if not redirected automatically</a>
    </div>
  </div>
</div>
{% endblock %}
