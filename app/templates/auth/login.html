{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-teal-50 to-purple-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-lg border border-teal-100">
    <div>
      <h2 class="mt-2 text-center text-3xl font-extrabold text-teal-800">
        🧘 Manas Mitra
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Your AI-Powered Mental Wellness Companion
      </p>
    </div>
    
    {% if error %}
    <div class="bg-red-50 border-l-4 border-red-400 p-4 mb-4">
      <div class="flex">
        <div class="ml-3">
          <p class="text-sm text-red-700">{{ error }}</p>
        </div>
      </div>
    </div>
    {% endif %}
    
    {% if success %}
    <div class="bg-green-50 border-l-4 border-green-400 p-4 mb-4">
      <div class="flex">
        <div class="ml-3">
          <p class="text-sm text-green-700">{{ success }}</p>
        </div>
      </div>
    </div>
    {% endif %}

    <form class="mt-8 space-y-6" action="/auth/login" method="POST">
      <div class="rounded-md shadow-sm space-y-4">
        <div>
          <label for="email-address" class="sr-only">Email address</label>
          <input id="email-address" name="email" type="email" autocomplete="email" required class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-teal-500 focus:border-teal-500 focus:z-10 sm:text-sm" placeholder="Email address">
        </div>
        <div x-data="{ show: false }" class="relative">
          <label for="password" class="sr-only">Password</label>
          <input id="password" name="password" :type="show ? 'text' : 'password'" autocomplete="current-password" required class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-teal-500 focus:border-teal-500 focus:z-10 sm:text-sm" placeholder="Password">
          <button type="button" @click="show = !show" class="absolute inset-y-0 right-0 pr-3 flex items-center text-sm leading-5 text-gray-500">
            <span x-show="!show">Show</span>
            <span x-show="show">Hide</span>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between">
        <div class="flex items-center">
          <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-teal-600 focus:ring-teal-500 border-gray-300 rounded">
          <label for="remember-me" class="ml-2 block text-sm text-gray-900">
            Remember me
          </label>
        </div>
      </div>

      <div>
        <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-gradient-to-r from-teal-500 to-teal-600 hover:from-teal-600 hover:to-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 shadow-md transform transition hover:-translate-y-0.5">
          Login
        </button>
      </div>
      
      <div class="text-center mt-4">
        <a href="/auth/register" class="font-medium text-teal-600 hover:text-teal-500 text-sm">
          Don't have an account? Register here
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
